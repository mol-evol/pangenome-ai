<header class="site-header">
  <div class="container header-inner">
    <a href="{{ "/" | strings.TrimPrefix "/"  | relURL }}" class="site-brand" aria-label="Pangenome AI home">
      Pangenome<span class="brand-name-accent"> AI</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <button class="nav-toggle" aria-controls="primary-nav" aria-expanded="false">
        <span class="visually-hidden">Menu</span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <ul id="primary-nav" class="nav-list">
        {{ range .Site.Menus.main }}
          <li><a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <a class="btn btn-primary header-cta" href="{{ "/contact/" | strings.TrimPrefix "/"  | relURL }}">Speak to us</a>
  </div>
</header>
<script>
  (function () {
    var btn = document.querySelector('.nav-toggle');
    var nav = document.getElementById('primary-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', function () {
      var open = nav.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  })();
</script>
